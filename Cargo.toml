[workspace]
resolver = "2"
members = [
    "crates/meliclaw-intent-router",
    "crates/meliclaw-intent-router-service",
    "crates/meliclaw-intent-router-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/meliclaw/semantic-router"
authors = ["Meliclaw"]
rust-version = "1.82"

[workspace.dependencies]
async-trait = "0.1"
ndarray = "0.16"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
clap = { version = "4.5", features = ["derive", "env"] }
base64 = "0.22"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-postgres = "0.7"
tokenizers = "0.21"
