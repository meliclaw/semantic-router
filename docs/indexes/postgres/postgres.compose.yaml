version: '3.8'

# Meliclaw: pin pgvector/pgvector:pg17 (never postgres:latest).
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: semantic_router
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
