# cargo-about config for THIRD_PARTY_NOTICES generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

[workarounds]
ring = "allow"
