# cargo-deny: bloquea copyleft no permisivo en el artefacto publicado.
# Guía Meliclaw §5 check 4.
#
# OpenMDW-1.1 aplica a pesos NVIDIA Nemotron-3-Embed-1B, no a crates de Rust.
# Apache-2.0 aplica a pesos Qwen3-Embedding, Qwen3-VL-Embedding y gte-Qwen2-7B-instruct (Alibaba/Qwen).
# CC-BY-NC-4.0 aplica a pesos jina-embeddings-v3 y NV-Embed-v2; tampoco es crate.
# No añadir OpenMDW ni CC-BY-NC a allow/deny: cargo-deny no inspecciona artefactos .onnx.
# Registro: THIRD_PARTY_NOTICES.md.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
deny = [
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "SSPL-1.0",
    "BUSL-1.1",
    "Elastic-2.0",
]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
