[package]
name = "meliclaw-intent-router-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "LocalAI embeddings probe for Meliclaw Capa 1 (OpenAI-compatible /v1/embeddings)"
readme = "README.md"

[[bin]]
name = "meliclaw-intent-embed"
path = "src/main.rs"

[dependencies]
meliclaw-intent-router = { path = "../meliclaw-intent-router", features = ["openai"] }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
